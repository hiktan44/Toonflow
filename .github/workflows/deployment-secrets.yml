name: Dağıtım belgesi anahtar kontrolü
on:
  push:
    branches: [master, 'codex/**']
    paths: ['DEPLOYMENT.md', 'scripts/check-deployment-secrets.mjs', 'tests/deployment-secrets.test.mjs', '.github/workflows/deployment-secrets.yml']
  pull_request:
    paths: ['DEPLOYMENT.md', 'scripts/check-deployment-secrets.mjs', 'tests/deployment-secrets.test.mjs', '.github/workflows/deployment-secrets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Anahtar sızıntısı regresyonları
        run: node --test tests/deployment-secrets.test.mjs
      - name: Gerçek dağıtım belgesini kontrol et
        run: node scripts/check-deployment-secrets.mjs
